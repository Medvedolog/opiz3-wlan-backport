name: Dispatch full image after SDK gate

on:
  push:
    branches:
      - ci/import-a3a93c5
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  SDK_RUN_ID: 37029705349
  TARGET_BRANCH: ci/uwe5622-010-160

jobs:
  wait-and-dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for SDK full + lean
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$SDK_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Dispatch full OpenWrt image build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-image.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          sleep 5
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build-image.yml \
            --branch "$TARGET_BRANCH" --event workflow_dispatch --limit 3 \
            --json databaseId,status,conclusion,url,headSha
