name: Build test image (OpenWrt 25.12.5)

on:
  push:
    branches:
      - dev/owrt-25.12-uwe5622-current
      - ci/uwe5622-build20-control
    paths:
      - 'package/**'
      - 'target/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_TAG: v25.12.5
  FOOTSTRAP_TAG: v0.14.13
  FOOTSTRAP_VERSION: 0.14.13
  AWG_COMMIT: 3f3ec68d594c8e965c988af75ac5314616229c88
  TARGET: sunxi
  SUBTARGET: cortexa53
  PROFILE: xunlong_orangepi-zero3

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd \
            ccache ecj fastjar java-propose-classpath libelf-dev \
            python3-distutils-extra qemu-utils subversion device-tree-compiler

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch "$OPENWRT_TAG" https://github.com/openwrt/openwrt.git
          cd openwrt
          git log -1 --oneline

      - name: Apply Zero 3 WLAN overlay
        working-directory: openwrt
        run: |
          cp -a ../overlay/package/kernel/uwe5622 package/kernel/
          cp -a ../overlay/package/firmware/uwe5622-firmware package/firmware/
          chmod +x package/kernel/uwe5622/files/sprdwl-delay

          mkdir -p package/network/utils/iwinfo/patches
          cp ../overlay/package/network/utils/iwinfo/patches/*.patch \
             package/network/utils/iwinfo/patches/

          cp ../overlay/target/linux/sunxi/patches-6.12/*.patch \
             target/linux/sunxi/patches-6.12/
          patch -p1 < ../overlay/target/linux/sunxi/image/cortexa53-device-packages.patch

          echo "UWE5622 patches:"
          ls -1 package/kernel/uwe5622/patches/
          test ! -f package/kernel/uwe5622/patches/100-unisocwifi-program-ap-channel-before-start.patch
          echo "Control build: patch 100 (AP SET_CHANNEL) intentionally disabled"
          grep -n "kmod-uwe5622" target/linux/sunxi/image/cortexa53.mk

      - name: Add Footstrap
        working-directory: openwrt
        run: |
          git clone --depth 1 --branch "$FOOTSTRAP_TAG" \
            https://github.com/VizzleTF/luci-theme-footstrap.git /tmp/footstrap
          cp -a /tmp/footstrap/luci-theme-footstrap package/luci-theme-footstrap
          rm -rf package/luci-theme-footstrap/.git
          test -f package/luci-theme-footstrap/Makefile
          test -f package/luci-theme-footstrap/root/etc/uci-defaults/30_luci-theme-footstrap
          echo "Footstrap $FOOTSTRAP_TAG staged"
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/zz-opiz3-footstrap-default <<'EOF'
          #!/bin/sh
          uci set luci.themes.Footstrap='/luci-static/footstrap'
          uci set luci.main.mediaurlbase='/luci-static/footstrap'
          uci commit luci
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/zz-opiz3-footstrap-default
          test -x files/etc/uci-defaults/zz-opiz3-footstrap-default

      - name: Add AmneziaWG packages
        working-directory: openwrt
        run: |
          git clone https://github.com/2Grey/awg-openwrt.git /tmp/awg-openwrt
          git -C /tmp/awg-openwrt checkout "$AWG_COMMIT"
          for p in kmod-amneziawg amneziawg-tools luci-app-amneziawg; do
            test -d "/tmp/awg-openwrt/$p"
            cp -a "/tmp/awg-openwrt/$p" "package/$p"
          done
          printf 'AmneziaWG source pinned at %s\n' "$AWG_COMMIT"

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Orange Pi Zero 3 test image
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa53=y
          CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-zero3=y

          CONFIG_TARGET_ROOTFS_PARTSIZE=512

          CONFIG_PACKAGE_kmod-uwe5622=y
          CONFIG_PACKAGE_uwe5622-firmware=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y

          # Broad USB Wi-Fi support for common MediaTek/Ralink, Realtek,
          # Atheros and Broadcom dongles. Firmware dependencies are pulled
          # by the corresponding kmod packages.
          CONFIG_PACKAGE_kmod-mt7601u=y
          CONFIG_PACKAGE_kmod-mt76x0u=y
          CONFIG_PACKAGE_kmod-mt76x2u=y
          # MT7663U is not selectable on this target in OpenWrt 25.12.5:
          # its hidden mt7615-common dependency is gated by @PCI_SUPPORT.
          CONFIG_PACKAGE_kmod-mt7921u=y
          CONFIG_PACKAGE_kmod-mt7925u=y
          CONFIG_PACKAGE_kmod-rt2800-usb=y
          CONFIG_PACKAGE_kmod-rt73-usb=y
          CONFIG_PACKAGE_kmod-rtl8xxxu=y
          CONFIG_PACKAGE_kmod-rtl8192cu=y
          CONFIG_PACKAGE_kmod-rtw88-8821au=y
          CONFIG_PACKAGE_kmod-rtw88-8812au=y
          CONFIG_PACKAGE_kmod-rtw88-8814au=y
          CONFIG_PACKAGE_kmod-rtw88-8821cu=y
          CONFIG_PACKAGE_kmod-rtw88-8822bu=y
          CONFIG_PACKAGE_kmod-rtw88-8822cu=y
          CONFIG_PACKAGE_kmod-rtw88-8723du=y
          CONFIG_PACKAGE_kmod-ath9k-htc=y
          CONFIG_PACKAGE_kmod-ath6kl-usb=y
          CONFIG_PACKAGE_kmod-brcmfmac=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-footstrap=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          # VPN stack
          CONFIG_PACKAGE_kmod-amneziawg=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-app-amneziawg=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          # kmod-tun: TUN mode for sing-box (Podkop/Forkop); OpenVPN dropped
          CONFIG_PACKAGE_kmod-tun=y

          # Podkop/Forkop runtime dependency superset. Do not install either
          # orchestrator here: both can later be installed without fetching
          # missing kernel/netfilter support.
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_coreutils-base64=y
          CONFIG_PACKAGE_bind-dig=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-netlink-diag=y
          CONFIG_PACKAGE_ucode=y
          CONFIG_PACKAGE_ucode-mod-fs=y
          CONFIG_PACKAGE_ucode-mod-uci=y

          # Cellular modem stack and USB transport support
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_comgt-ncm=y

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-acm=y

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-eem=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-subset=y
          CONFIG_PACKAGE_kmod-mii=y

          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-smsc95xx=y
          CONFIG_PACKAGE_kmod-usb-net-lan78xx=y
          CONFIG_PACKAGE_kmod-usb-net-dm9601-ether=y
          CONFIG_PACKAGE_kmod-usb-net-sr9700=y

          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-mbim=y
          CONFIG_PACKAGE_luci-proto-ncm=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y

          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_picocom=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-timeout=y
          CONFIG_PACKAGE_coreutils-stty=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ip-bridge=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_lsof=y
          CONFIG_PACKAGE_strace=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_chat=y

          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_htop=y
          EOF

          make defconfig

          echo "== requested package preflight =="
          for p in \
            modemmanager uqmi umbim usb-modeswitch comgt comgt-ncm \
            kmod-usb-core kmod-usb2 kmod-usb3 \
            kmod-usb-serial kmod-usb-serial-wwan kmod-usb-serial-option kmod-usb-acm \
            kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-rndis \
            kmod-usb-net-cdc-ncm kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan \
            kmod-usb-net-cdc-subset kmod-mii \
            kmod-mt7601u kmod-mt76x0u kmod-mt76x2u \
            kmod-mt7921u kmod-mt7925u kmod-rt2800-usb kmod-rt73-usb \
            kmod-rtl8xxxu kmod-rtl8192cu kmod-rtw88-8821au kmod-rtw88-8812au \
            kmod-rtw88-8814au kmod-rtw88-8821cu kmod-rtw88-8822bu \
            kmod-rtw88-8822cu kmod-rtw88-8723du kmod-ath9k-htc \
            kmod-ath6kl-usb kmod-brcmfmac \
            kmod-amneziawg amneziawg-tools luci-app-amneziawg \
            kmod-wireguard wireguard-tools luci-proto-wireguard \
            kmod-tun \
            sing-box curl jq ca-bundle coreutils-base64 bind-dig nftables-json \
            kmod-nft-tproxy kmod-nf-tproxy kmod-nft-socket kmod-nft-nat \
            kmod-inet-diag kmod-netlink-diag ucode ucode-mod-fs ucode-mod-uci \
            luci-proto-qmi luci-proto-mbim luci-proto-ncm luci-proto-modemmanager \
            usbutils pciutils picocom coreutils coreutils-timeout coreutils-stty \
            ethtool ip-full ip-bridge tcpdump lsof strace ppp chat; do
            if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              printf '  OK      %s\n' "$p"
            else
              printf '  MISSING/NOT-SELECTED %s\n' "$p"
              exit 1
            fi
          done

          echo "Selected WLAN/test packages:"
          grep -E '^CONFIG_PACKAGE_(kmod-uwe5622|uwe5622-firmware|luci|luci-ssl|luci-theme-footstrap|luci-theme-bootstrap|iperf3|iw|iwinfo|wireless-regdb)=y' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j8 V=s

      - name: Build image
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s > build.log 2>&1 || {
            echo "=== parallel build failed ==="
            tail -120 build.log
            echo "=== serial retry for readable error ==="
            make -j1 V=s 2>&1 | tail -240
            exit 1
          }
          tail -60 build.log

      - name: Validate image
        working-directory: openwrt
        run: |
          OUT=bin/targets/$TARGET/$SUBTARGET
          echo "== images =="
          ls -lh "$OUT"/*.img.gz

          echo "== required packages =="
          MANIFEST=$(find "$OUT" -maxdepth 1 -name '*orangepi-zero3*.manifest' | head -1)
          test -n "$MANIFEST"
          for p in \
            kmod-uwe5622 uwe5622-firmware \
            luci luci-ssl luci-theme-footstrap luci-theme-bootstrap \
            modemmanager uqmi umbim usb-modeswitch comgt comgt-ncm \
            kmod-usb-core kmod-usb2 kmod-usb3 \
            kmod-usb-serial kmod-usb-serial-wwan kmod-usb-serial-option kmod-usb-acm \
            kmod-usb-net kmod-usb-net-rndis kmod-usb-net-cdc-ether \
            kmod-usb-net-cdc-ncm kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan \
            kmod-usb-net-cdc-eem kmod-usb-net-cdc-subset kmod-mii \
            kmod-usb-net-rtl8152 kmod-usb-net-asix kmod-usb-net-asix-ax88179 \
            kmod-usb-net-smsc95xx kmod-usb-net-lan78xx \
            kmod-usb-net-dm9601-ether kmod-usb-net-sr9700 \
            kmod-mt7601u kmod-mt76x0u kmod-mt76x2u \
            kmod-mt7921u kmod-mt7925u kmod-rt2800-usb kmod-rt73-usb \
            kmod-rtl8xxxu kmod-rtl8192cu kmod-rtw88-8821au kmod-rtw88-8812au \
            kmod-rtw88-8814au kmod-rtw88-8821cu kmod-rtw88-8822bu \
            kmod-rtw88-8822cu kmod-rtw88-8723du kmod-ath9k-htc \
            kmod-ath6kl-usb kmod-brcmfmac \
            kmod-amneziawg amneziawg-tools luci-app-amneziawg \
            kmod-wireguard wireguard-tools luci-proto-wireguard \
            kmod-tun \
            sing-box curl jq ca-bundle coreutils-base64 bind-dig nftables-json \
            kmod-nft-tproxy kmod-nf-tproxy kmod-nft-socket kmod-nft-nat \
            kmod-inet-diag kmod-netlink-diag ucode ucode-mod-fs ucode-mod-uci \
            luci-proto-qmi luci-proto-mbim luci-proto-ncm luci-proto-modemmanager \
            usbutils pciutils picocom coreutils coreutils-timeout coreutils-stty \
            ethtool ip-full ip-bridge tcpdump lsof strace ppp chat \
            iw iwinfo wireless-regdb iperf3; do
            if grep -q "^$p " "$MANIFEST"; then
              printf '  OK      %s\n' "$p"
            else
              printf '  MISSING %s\n' "$p"
              exit 1
            fi
          done

          echo "== driver symbols =="
          KO=$(find build_dir -name sprdwl_ng.ko | head -1)
          test -n "$KO"
          for sym in sprdwl_cfg80211_dump_station sprdwl_add_assoc_sta \
                     sprdwl_cfg80211_get_channel sprdwl_ap_get_station \
                     tx_stats_show peer_stats_show disable_powersave; do
            strings "$KO" | grep -q "$sym" && printf '  OK      %s\n' "$sym" || exit 1
          done
          if strings "$KO" | grep -q 'AP WIFI_CMD_SET_CHANNEL'; then
            echo "ERROR: control build still contains patch-100 SET_CHANNEL marker" >&2
            exit 1
          fi
          printf '  OK      patch100 SET_CHANNEL marker absent (control)\n'
          strings "$KO" | grep -q 'sprdwl_start_ap' && \
            printf '  OK      sprdwl_start_ap present\n' || exit 1
          strings "$KO" | grep -q 'START_AP chandef freq=' && \
            printf '  OK      patch170 START_AP IE diagnostics present\n' || exit 1
          strings "$KO" | grep -q 'DS_PARAMS not present in beacon head' && \
            printf '  OK      patch180 DeepAQ 5GHz DS fallback present\n' || exit 1
          strings "$KO" | grep -q 'channel limits: 2.4 GHz' && \
            printf '  OK      patch200 channel width/channel clamp present\n' || exit 1
          strings "$KO" | grep -q 'layout mismatch: ret %d' && \
            printf '  OK      patch230 cp_sta_table reader present\n' || exit 1

          echo "== iwinfo UWE5622 hardware name =="
          IWDB=$(find build_dir -path '*/iwinfo-*/devices.txt' | head -1)
          test -n "$IWDB"
          grep -q '"platform:unisoc_wifi"' "$IWDB"
          grep -q 'device/modalias' "$(dirname "$IWDB")/iwinfo_nl80211.c"
          printf '  OK      iwinfo modalias fallback + UWE5622 entry\n'

          echo "== UWE5622 runtime files in rootfs =="
          ROOT=$(find build_dir -maxdepth 2 -type d -name 'root-sunxi*' | head -1)
          test -n "$ROOT"
          test -f "$ROOT/etc/uwe5622.options"
          test -x "$ROOT/usr/sbin/uwe5622-clamp-htmode"
          test -x "$ROOT/usr/sbin/uwe5622-recover"
          test -f "$ROOT/etc/hotplug.d/platform/50-uwe5622-recover"
          grep -q 'insmod sprdwl_ng disable_powersave=1' "$ROOT/etc/init.d/sprdwl-delay"
          grep -q '"platform:unisoc_wifi"' "$ROOT/usr/share/libiwinfo/devices.txt"
          printf '  OK      options, htmode clamp, insmod loader, iwinfo entry\n'

          echo "== OpenVPN excluded =="
          if grep -qE '^(openvpn-[a-z]+|luci-app-openvpn) ' "$MANIFEST"; then
            echo "ERROR: OpenVPN packages present in image" >&2
            exit 1
          fi
          printf '  OK      no OpenVPN packages\n'

          echo "== Footstrap default payload =="
          test -x files/etc/uci-defaults/zz-opiz3-footstrap-default
          grep -q "mediaurlbase='/luci-static/footstrap'" \
            files/etc/uci-defaults/zz-opiz3-footstrap-default
          printf '  OK      zz-opiz3-footstrap-default\n'

          # Preserve exact full-image ABI test payload for fast hardware iteration.
          cp "$KO" "$OUT/sprdwl_ng-ap-channel-test.ko"
          KMOD_APK=$(find "$OUT/packages" -maxdepth 1 -name 'kmod-uwe5622-*.apk' | head -1)
          test -n "$KMOD_APK"
          cp "$KMOD_APK" "$OUT/kmod-uwe5622-ap-channel-test.apk"

          KERNEL_VERMAGIC=$(find build_dir -path '*/linux-sunxi_cortexa53/linux-*/.vermagic' | head -1)
          test -n "$KERNEL_VERMAGIC"
          KERNEL_DIR=$(dirname "$KERNEL_VERMAGIC")
          cp "$KERNEL_DIR/.config" "$OUT/kernel-build.config"
          cp "$KERNEL_DIR/.vermagic" "$OUT/kernel-build.vermagic"
          printf 'full-image kernel ABI hash: '
          cat "$OUT/kernel-build.vermagic"
          sha256sum "$OUT/sprdwl_ng-ap-channel-test.ko" \
                    "$OUT/kmod-uwe5622-ap-channel-test.apk" \
            > "$OUT/driver-hotfix.sha256"

          echo "== delayed load policy =="
          grep -q 'insmod sprdwl_ng disable_powersave=1' \
            package/kernel/uwe5622/files/sprdwl-delay
          test -f package/kernel/uwe5622/files/uwe5622.options
          grep -q 'uwe5622-clamp-htmode' package/kernel/uwe5622/files/sprdwl-delay
          sh -n package/kernel/uwe5622/files/uwe5622-clamp-htmode
          sh -n package/kernel/uwe5622/files/uwe5622-recover
          sh -n package/kernel/uwe5622/files/50-uwe5622-recover

          echo "== Zero 3 DTB mmc1 =="
          DTB=$(find build_dir -name 'sun50i-h618-orangepi-zero3.dtb' | head -1)
          test -n "$DTB"

          # Decompile once, then extract the complete mmc1 node by brace depth.
          # Count literal braces without regex escaping.
          dtc -I dtb -O dts "$DTB" 2>/dev/null > /tmp/opiz3.dts
          awk '
            function count_char(s, ch,    n, i) {
              n = 0
              for (i = 1; i <= length(s); i++)
                if (substr(s, i, 1) == ch)
                  n++
              return n
            }
            !in_node && index($0, "mmc@4021000") && index($0, "{") {
              in_node = 1
              depth = 0
            }
            in_node {
              print
              depth += count_char($0, "{") - count_char($0, "}")
              if (depth == 0)
                exit
            }
          ' /tmp/opiz3.dts > "$OUT/mmc1-node.dts"

          test -s "$OUT/mmc1-node.dts"
          if [ "$(wc -l < "$OUT/mmc1-node.dts")" -lt 3 ]; then
            echo "ERROR: mmc1-node.dts parser produced fewer than 3 lines" >&2
            cat "$OUT/mmc1-node.dts" >&2
            exit 1
          fi
          LAST_NODE_LINE=$(tail -1 "$OUT/mmc1-node.dts" | tr -d '[:space:]')
          if [ "$LAST_NODE_LINE" != '};' ]; then
            echo "ERROR: mmc1-node.dts parser produced an incomplete node" >&2
            cat "$OUT/mmc1-node.dts" >&2
            exit 1
          fi
          cat "$OUT/mmc1-node.dts"

          for prop in vmmc-supply vqmmc-supply mmc-pwrseq bus-width \
                      non-removable mmc-ddr-1_8v; do
            if grep -q "$prop" "$OUT/mmc1-node.dts"; then
              printf '  OK      %s\n' "$prop"
            else
              printf '  MISSING %s\n' "$prop"
              exit 1
            fi
          done
          grep -q 'status = "okay";' "$OUT/mmc1-node.dts"
          printf '  OK      status=okay\n'

      - name: Preserve build diagnostics
        if: always()
        working-directory: openwrt
        run: |
          OUT=bin/targets/$TARGET/$SUBTARGET
          mkdir -p "$OUT"
          if [ -f build.log ]; then
            tail -n 500 build.log > "$OUT/build-tail.log"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opiz3-openwrt-25.12.5-uwe5622-test
          retention-days: 30
          if-no-files-found: warn
          path: |
            openwrt/bin/targets/sunxi/cortexa53/*orangepi-zero3*.img.gz
            openwrt/bin/targets/sunxi/cortexa53/*orangepi-zero3*.manifest
            openwrt/bin/targets/sunxi/cortexa53/sha256sums
            openwrt/bin/targets/sunxi/cortexa53/mmc1-node.dts
            openwrt/bin/targets/sunxi/cortexa53/sprdwl_ng-ap-channel-test.ko
            openwrt/bin/targets/sunxi/cortexa53/kmod-uwe5622-ap-channel-test.apk
            openwrt/bin/targets/sunxi/cortexa53/kernel-build.config
            openwrt/bin/targets/sunxi/cortexa53/kernel-build.vermagic
            openwrt/bin/targets/sunxi/cortexa53/driver-hotfix.sha256
            openwrt/bin/targets/sunxi/cortexa53/build-tail.log
