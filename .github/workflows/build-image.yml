name: Build test image (OpenWrt 25.12.5)

on:
  push:
    branches:
      - dev/uwe5622-ap-mac-fix
    paths:
      - 'package/**'
      - 'target/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_TAG: v25.12.5
  FOOTSTRAP_TAG: v0.14.13
  FOOTSTRAP_VERSION: 0.14.13
  TARGET: sunxi
  SUBTARGET: cortexa53
  PROFILE: xunlong_orangepi-zero3

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd \
            ccache ecj fastjar java-propose-classpath libelf-dev \
            python3-distutils-extra qemu-utils subversion device-tree-compiler

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch "$OPENWRT_TAG" https://github.com/openwrt/openwrt.git
          cd openwrt
          git log -1 --oneline

      - name: Apply Zero 3 WLAN overlay
        working-directory: openwrt
        run: |
          cp -a ../overlay/package/kernel/uwe5622 package/kernel/
          cp -a ../overlay/package/firmware/uwe5622-firmware package/firmware/
          chmod +x package/kernel/uwe5622/files/sprdwl-delay

          mkdir -p files
          cp -a ../overlay/files/. files/
          chmod +x files/etc/uci-defaults/99-opiz3-defaults

          cp ../overlay/target/linux/sunxi/patches-6.12/*.patch \
             target/linux/sunxi/patches-6.12/
          patch -p1 < ../overlay/target/linux/sunxi/image/cortexa53-device-packages.patch

          echo "UWE5622 patches:"
          ls -1 package/kernel/uwe5622/patches/
          grep -n "kmod-uwe5622" target/linux/sunxi/image/cortexa53.mk

      - name: Add Footstrap
        working-directory: openwrt
        run: |
          git clone --depth 1 --branch "$FOOTSTRAP_TAG" \
            https://github.com/VizzleTF/luci-theme-footstrap.git /tmp/footstrap
          cp -a /tmp/footstrap/luci-theme-footstrap package/luci-theme-footstrap
          rm -rf package/luci-theme-footstrap/.git
          test -f package/luci-theme-footstrap/Makefile
          test -f package/luci-theme-footstrap/root/etc/uci-defaults/30_luci-theme-footstrap
          echo "Footstrap $FOOTSTRAP_TAG staged"

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Brand UWE5622 in LuCI and hide unavailable peer telemetry
        working-directory: openwrt
        run: |
          python3 ../overlay/tools/patch-luci-uwe5622.py feeds/luci
          grep -q 'UNISOC UWE5622' feeds/luci/modules/luci-base/htdocs/luci-static/resources/network.js
          grep -q 'rate information unavailable' feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include/60_wifi.js

      - name: Configure Orange Pi Zero 3 test image
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa53=y
          CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-zero3=y

          CONFIG_TARGET_ROOTFS_PARTSIZE=512

          CONFIG_PACKAGE_kmod-uwe5622=y
          CONFIG_PACKAGE_uwe5622-firmware=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-footstrap=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          # Cellular modem stack and USB transport support
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_comgt-ncm=y

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
          CONFIG_PACKAGE_kmod-usb-acm=y

          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-eem=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-subset=y
          CONFIG_PACKAGE_kmod-mii=y

          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-smsc95xx=y
          CONFIG_PACKAGE_kmod-usb-net-lan78xx=y
          CONFIG_PACKAGE_kmod-usb-net-dm9601-ether=y
          CONFIG_PACKAGE_kmod-usb-net-sr9700=y

          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-mbim=y
          CONFIG_PACKAGE_luci-proto-ncm=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y

          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_picocom=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-timeout=y
          CONFIG_PACKAGE_coreutils-stty=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ip-bridge=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_lsof=y
          CONFIG_PACKAGE_strace=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_chat=y

          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_htop=y
          EOF

          make defconfig

          echo "== requested package preflight =="
          for p in \
            modemmanager uqmi umbim usb-modeswitch comgt comgt-ncm \
            kmod-usb-core kmod-usb2 kmod-usb3 \
            kmod-usb-serial kmod-usb-serial-wwan kmod-usb-serial-option kmod-usb-serial-qualcomm kmod-usb-acm \
            kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-rndis \
            kmod-usb-net-cdc-ncm kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan \
            kmod-usb-net-cdc-subset kmod-mii \
            luci-proto-qmi luci-proto-mbim luci-proto-ncm luci-proto-modemmanager \
            usbutils pciutils picocom coreutils coreutils-timeout coreutils-stty \
            ethtool ip-full ip-bridge tcpdump lsof strace ppp chat; do
            if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              printf '  OK      %s\n' "$p"
            else
              printf '  MISSING/NOT-SELECTED %s\n' "$p"
              exit 1
            fi
          done

          echo "Selected WLAN/test packages:"
          grep -E '^CONFIG_PACKAGE_(kmod-uwe5622|uwe5622-firmware|luci|luci-ssl|luci-theme-footstrap|luci-theme-bootstrap|iperf3|iw|iwinfo|wireless-regdb)=y' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j8 V=s

      - name: Build image
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s > build.log 2>&1 || {
            echo "=== parallel build failed ==="
            tail -120 build.log
            echo "=== serial retry for readable error ==="
            make -j1 V=s 2>&1 | tail -240
            exit 1
          }
          tail -60 build.log

      - name: Validate image
        working-directory: openwrt
        run: |
          OUT=bin/targets/$TARGET/$SUBTARGET
          echo "== images =="
          ls -lh "$OUT"/*.img.gz

          echo "== required packages =="
          MANIFEST=$(find "$OUT" -maxdepth 1 -name '*orangepi-zero3*.manifest' | head -1)
          test -n "$MANIFEST"
          for p in \
            kmod-uwe5622 uwe5622-firmware \
            luci luci-ssl luci-theme-footstrap luci-theme-bootstrap \
            modemmanager uqmi umbim usb-modeswitch comgt comgt-ncm \
            kmod-usb-core kmod-usb2 kmod-usb3 \
            kmod-usb-serial kmod-usb-serial-wwan kmod-usb-serial-option kmod-usb-serial-qualcomm kmod-usb-acm \
            kmod-usb-net kmod-usb-net-rndis kmod-usb-net-cdc-ether \
            kmod-usb-net-cdc-ncm kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan \
            kmod-usb-net-cdc-eem kmod-usb-net-cdc-subset kmod-mii \
            kmod-usb-net-rtl8152 kmod-usb-net-asix kmod-usb-net-asix-ax88179 \
            kmod-usb-net-smsc95xx kmod-usb-net-lan78xx \
            kmod-usb-net-dm9601-ether kmod-usb-net-sr9700 \
            luci-proto-qmi luci-proto-mbim luci-proto-ncm luci-proto-modemmanager \
            usbutils pciutils picocom coreutils coreutils-timeout coreutils-stty \
            ethtool ip-full ip-bridge tcpdump lsof strace ppp chat \
            iw iwinfo wireless-regdb iperf3; do
            if grep -q "^$p " "$MANIFEST"; then
              printf '  OK      %s\n' "$p"
            else
              printf '  MISSING %s\n' "$p"
              exit 1
            fi
          done

          echo "== driver symbols =="
          KO=$(find build_dir -name sprdwl_ng.ko | head -1)
          test -n "$KO"
          for sym in sprdwl_cfg80211_dump_station sprdwl_add_assoc_sta \
                     sprdwl_cfg80211_get_channel disable_powersave; do
            strings "$KO" | grep -q "$sym" && printf '  OK      %s\n' "$sym" || exit 1
          done

          echo "== UWE5622 AP hotfix =="
          strings "$KO" | grep -q 'generated fallback'
          ! strings "$KO" | grep -q 'AP WIFI_CMD_SET_CHANNEL'

          echo "== delayed load / factory AP policy =="
          DELAY=package/kernel/uwe5622/files/sprdwl-delay
          grep -q 'modprobe sprdwl_ng disable_powersave=1' "$DELAY"
          grep -q 'OPIZ3_AP' "$DELAY"
          grep -q '12345678' "$DELAY"
          grep -q 'set wireless.radio0.channel=7' "$DELAY"
          grep -q 'set wireless.radio0.htmode=HT20' "$DELAY"
          grep -q 'set wireless.opiz3_ap.encryption=psk2' "$DELAY"
          grep -q 'set wireless.opiz3_ap.cipher=ccmp' "$DELAY"
          grep -q 'set wireless.opiz3_ap.ieee80211w=0' "$DELAY"
          grep -q 'luci.main.mediaurlbase=/luci-static/footstrap' "$DELAY"

          echo "== UWE5622 AP channel / station telemetry patches =="
          grep -q 'settings->chandef.chan->hw_value' package/kernel/uwe5622/patches/110-unisocwifi-ap-channel-from-chandef.patch
          grep -q 'WIFI_CMD_GET_STATION carries no peer MAC' package/kernel/uwe5622/patches/120-unisocwifi-do-not-fake-ap-peer-telemetry.patch

          echo "== factory timezone =="
          grep -q "timezone='MSK-3'" files/etc/uci-defaults/99-opiz3-defaults
          grep -q "zonename='Europe/Moscow'" files/etc/uci-defaults/99-opiz3-defaults

          echo "== Zero 3 DTB mmc1 (diagnostic only) =="
          DTB=$(find build_dir -name '*orangepi-zero3*.dtb' | head -1)
          if [ -n "$DTB" ]; then
            dtc -I dtb -O dts "$DTB" 2>/dev/null > /tmp/opiz3.dts || true
            awk '
              /^[[:space:]]*mmc@4021000[[:space:]]*\{/ {
                in_node = 1
                depth = 0
              }
              in_node {
                print
                line = $0
                opens = gsub(/{/, "{", line)
                closes = gsub(/}/, "}", line)
                depth += opens - closes
                if (depth == 0)
                  exit
              }
            ' /tmp/opiz3.dts > "$OUT/mmc1-node.dts" || true
            [ -s "$OUT/mmc1-node.dts" ] && cat "$OUT/mmc1-node.dts" || true
          else
            echo "DTB not retained in build_dir after image generation; skipping legacy diagnostic"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opiz3-openwrt-25.12.5-uwe5622-ap-footstrap-full
          retention-days: 30
          if-no-files-found: warn
          path: |
            openwrt/bin/targets/sunxi/cortexa53/*orangepi-zero3*.img.gz
            openwrt/bin/targets/sunxi/cortexa53/*orangepi-zero3*.manifest
            openwrt/bin/targets/sunxi/cortexa53/sha256sums
            openwrt/bin/targets/sunxi/cortexa53/mmc1-node.dts
