name: Audit Routerich modem packages

on:
  push:
    branches:
      - dev/owrt-25.12-uwe5622-current
    paths:
      - .github/workflows/audit-routerich-packages.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and unpack packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit
          base="https://raw.githubusercontent.com/routerich/packages.routerich/24.10.5/routerich"
          for pkg in             automodem_1.1.0-r2_all.ipk             modeminfo_1.1.8-r5_all.ipk             luci-app-modeminfo_1.6.3-r2_all.ipk; do
            d="/tmp/audit/${pkg%.ipk}"
            mkdir -p "$d"
            curl -fL "$base/$pkg" -o "$d/pkg.ipk"
            (
              cd "$d"
              ar x pkg.ipk
              mkdir root control
              tar -xf data.tar.* -C root
              tar -xf control.tar.* -C control
            )
          done

      - name: Show package metadata and file trees
        shell: bash
        run: |
          set -euo pipefail
          for d in /tmp/audit/*; do
            echo "===== PACKAGE: $(basename "$d") ====="
            echo "--- CONTROL ---"
            cat "$d/control/control" || true
            echo "--- FILES ---"
            find "$d/root" -type f -printf '%P\n' | sort
          done

      - name: Show automodem source
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/audit/automodem_1.1.0-r2_all/root
          for f in $(find "$d" -type f | sort); do
            echo "===== AUTOMODEM FILE: ${f#$d/} ====="
            if file "$f" | grep -qiE 'text|script|json|empty'; then
              sed -n '1,500p' "$f"
            else
              file "$f"
            fi
          done

      - name: Show modeminfo core source
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/audit/modeminfo_1.1.8-r5_all/root
          for f in $(find "$d" -type f | sort); do
            echo "===== MODEMINFO FILE: ${f#$d/} ====="
            if file "$f" | grep -qiE 'text|script|json|empty'; then
              sed -n '1,500p' "$f"
            else
              file "$f"
            fi
          done

      - name: Show LuCI modeminfo source
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/audit/luci-app-modeminfo_1.6.3-r2_all/root
          for f in $(find "$d" -type f | sort); do
            echo "===== LUCI FILE: ${f#$d/} ====="
            if file "$f" | grep -qiE 'text|script|json|javascript|empty'; then
              sed -n '1,500p' "$f"
            else
              file "$f"
            fi
          done
