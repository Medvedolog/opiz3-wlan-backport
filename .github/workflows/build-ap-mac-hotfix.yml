name: Build AP MAC hotfix (exact image ABI)

on:
  push:
    branches:
      - dev/uwe5622-ap-mac-fix
    paths:
      - 'package/kernel/uwe5622/**'
      - '.github/workflows/build-ap-mac-hotfix.yml'
  workflow_dispatch:

concurrency:
  group: ap-mac-hotfix-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_TAG: v25.12.5
  TARGET: sunxi
  SUBTARGET: cortexa53
  EXPECTED_VERMAGIC: 79ca48062681d8889cb3918c03e103d2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          sudo docker image prune -af 2>/dev/null || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd \
            ccache ecj fastjar java-propose-classpath libelf-dev \
            python3-distutils-extra qemu-utils subversion device-tree-compiler

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch "$OPENWRT_TAG" https://github.com/openwrt/openwrt.git

      - name: Apply WLAN overlay
        working-directory: openwrt
        run: |
          cp -a ../overlay/package/kernel/uwe5622 package/kernel/
          cp -a ../overlay/package/firmware/uwe5622-firmware package/firmware/
          chmod +x package/kernel/uwe5622/files/sprdwl-delay
          cp ../overlay/target/linux/sunxi/patches-6.12/*.patch target/linux/sunxi/patches-6.12/
          patch -p1 < ../overlay/target/linux/sunxi/image/cortexa53-device-packages.patch

          echo "Driver patches:"
          ls -1 package/kernel/uwe5622/patches/
          test -f package/kernel/uwe5622/patches/100-unisocwifi-valid-fallback-mac.patch
          ! grep -R -q 'AP WIFI_CMD_SET_CHANNEL' package/kernel/uwe5622/patches/

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure exactly like full image
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa53=y
          CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-zero3=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=512

          CONFIG_PACKAGE_kmod-uwe5622=y
          CONFIG_PACKAGE_uwe5622-firmware=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_comgt-ncm=y

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-acm=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-eem=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-subset=y
          CONFIG_PACKAGE_kmod-mii=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-smsc95xx=y
          CONFIG_PACKAGE_kmod-usb-net-lan78xx=y
          CONFIG_PACKAGE_kmod-usb-net-dm9601-ether=y
          CONFIG_PACKAGE_kmod-usb-net-sr9700=y

          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-mbim=y
          CONFIG_PACKAGE_luci-proto-ncm=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y

          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_picocom=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-timeout=y
          CONFIG_PACKAGE_coreutils-stty=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ip-bridge=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_lsof=y
          CONFIG_PACKAGE_strace=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_chat=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_htop=y
          EOF
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: make download -j8 V=s

      - name: Prepare and verify patch
        working-directory: openwrt
        run: |
          set -o pipefail
          make package/kernel/uwe5622/prepare V=s > uwe-prepare.log 2>&1 || {
            tail -160 uwe-prepare.log
            exit 1
          }
          SRC=$(find build_dir -path '*/uwe5622-*/unisocwifi/main.c' | head -1)
          test -n "$SRC"
          grep -q 'generated fallback' "$SRC"
          if grep -q 'AP WIFI_CMD_SET_CHANNEL' "$SRC"; then
            echo "FATAL: unsafe AP SET_CHANNEL patch is present"
            exit 1
          fi

      - name: Build target kernel for exact ABI
        working-directory: openwrt
        run: |
          set -o pipefail
          make target/linux/compile -j"$(nproc)" V=s > kernel.log 2>&1 || {
            tail -200 kernel.log
            exit 1
          }
          VM=$(find build_dir -path '*/linux-sunxi_cortexa53/linux-*/.vermagic' | head -1)
          test -n "$VM"
          ACTUAL=$(cat "$VM")
          echo "kernel ABI: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED_VERMAGIC"

      - name: Build cfg80211 backport and UWE5622 only
        working-directory: openwrt
        run: |
          set -o pipefail
          make package/kernel/mac80211/compile -j"$(nproc)" V=s > mac80211.log 2>&1 || {
            tail -160 mac80211.log
            exit 1
          }
          make package/kernel/uwe5622/compile -j"$(nproc)" V=s > uwe5622.log 2>&1 || {
            tail -200 uwe5622.log
            exit 1
          }

      - name: Validate and stage test module
        working-directory: openwrt
        run: |
          mkdir -p hotfix
          KO=$(find build_dir -path '*/uwe5622-*/unisocwifi/sprdwl_ng.ko' | head -1)
          test -n "$KO"
          cp "$KO" hotfix/sprdwl_ng-ap-mac-fix.ko
          modinfo "$KO" | grep -E 'vermagic|filename'
          strings "$KO" | grep -q 'generated fallback'
          ! strings "$KO" | grep -q 'AP WIFI_CMD_SET_CHANNEL'
          sha256sum hotfix/sprdwl_ng-ap-mac-fix.ko > hotfix/sha256sums

          APK=$(find bin/targets/$TARGET/$SUBTARGET/packages -name 'kmod-uwe5622-*.apk' | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" hotfix/
            sha256sum "$APK" >> hotfix/sha256sums
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uwe5622-ap-mac-fix-exact-abi
          retention-days: 30
          if-no-files-found: warn
          path: |
            openwrt/hotfix/*
            openwrt/kernel.log
            openwrt/mac80211.log
            openwrt/uwe5622.log
