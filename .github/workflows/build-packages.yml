name: Build packages (SDK)

# Siklus cepat: hanya membangun kmod-uwe5622 dan firmware-nya memakai SDK
# resmi OpenWrt. Dipakai saat mengubah patch driver, karena tidak perlu
# membangun toolchain dari nol.

on:
  push:
    paths:
      - 'package/**'
      - '.github/workflows/build-packages.yml'
  workflow_dispatch:

env:
  RELEASE: 25.12.5
  TARGET: sunxi
  SUBTARGET: cortexa53
  SDK_SUFFIX: sunxi-cortexa53_gcc-14.3.0_musl.Linux-x86_64

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pasang dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Unduh SDK OpenWrt ${{ env.RELEASE }}
        run: |
          BASE=https://downloads.openwrt.org/releases/$RELEASE/targets/$TARGET/$SUBTARGET
          SDK=openwrt-sdk-$RELEASE-$SDK_SUFFIX
          curl -fsSL -O "$BASE/$SDK.tar.zst"
          tar --zstd -xf "$SDK.tar.zst"
          mv "$SDK" sdk
          echo "SDK siap: $(du -sh sdk | cut -f1)"

      - name: Ambil package/kernel/mac80211
        # SDK tidak menyertakan mac80211, padahal driver ini dibangun terhadap
        # header cfg80211 hasil backport-nya. Diambil dari commit openwrt yang
        # dipin oleh feed 'base' milik SDK, supaya API-nya persis cocok.
        run: |
          BASE_COMMIT=$(sed -n 's|.*openwrt.git^\([0-9a-f]*\).*|\1|p' sdk/feeds.conf.default)
          echo "commit base: $BASE_COMMIT"
          curl -fsSL -o ow.tar.gz "https://codeload.github.com/openwrt/openwrt/tar.gz/$BASE_COMMIT"
          tar -xzf ow.tar.gz "openwrt-$BASE_COMMIT/package/kernel/mac80211"
          mv "openwrt-$BASE_COMMIT/package/kernel/mac80211" sdk/package/kernel/
          rm -rf ow.tar.gz "openwrt-$BASE_COMMIT"

      - name: Pasang paket uwe5622
        run: |
          cp -r package/kernel/uwe5622 sdk/package/kernel/
          cp -r package/firmware/uwe5622-firmware sdk/package/firmware/
          chmod +x sdk/package/kernel/uwe5622/files/sprdwl-delay
          echo "patch driver yang diterapkan:"
          ls package/kernel/uwe5622/patches/

      - name: Konfigurasi
        working-directory: sdk
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa53=y
          CONFIG_PACKAGE_kmod-uwe5622=m
          CONFIG_PACKAGE_uwe5622-firmware=y
          EOF
          make defconfig

      - name: Build
        working-directory: sdk
        run: |
          make package/kernel/mac80211/compile -j$(nproc) V=s 2>&1 | tail -40
          make package/kernel/uwe5622/compile \
               package/firmware/uwe5622-firmware/compile -j$(nproc) V=s 2>&1 | tail -60

      - name: Periksa hasil
        working-directory: sdk
        run: |
          echo "== paket yang dihasilkan =="
          ls -la bin/targets/$TARGET/$SUBTARGET/packages/*uwe5622* || {
            echo "GAGAL: paket uwe5622 tidak terbentuk"; exit 1; }
          echo
          echo "== simbol penting di dalam sprdwl_ng.ko =="
          KO=$(find build_dir -name sprdwl_ng.ko | head -1)
          for sym in sprdwl_cfg80211_dump_station sprdwl_add_assoc_sta \
                     sprdwl_cfg80211_get_channel sprdwl_save_sta_channel \
                     disable_powersave; do
            if strings "$KO" | grep -q "$sym"; then echo "  OK      $sym"
            else echo "  HILANG  $sym"; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: uwe5622-packages-${{ env.RELEASE }}
          path: sdk/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/packages/*uwe5622*
