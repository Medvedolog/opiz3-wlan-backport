name: Release a tested build

# Pushing a tag like opiz3-25.12.5-beta1, or running this workflow by hand
# (Actions -> Release a tested build -> Run workflow, with the tag name),
# turns the current rolling build
# (release opiz3-<RELEASE>-latest) into a fixed release with the notes from
# docs/releases/<tag>.md. Nothing is rebuilt: the files are the ones that
# were tested. The tag must not change any build input against the commit
# the rolling build was made from.

on:
  push:
    tags:
      - 'opiz3-*-beta*'
      - 'opiz3-*-rc*'
      - 'opiz3-*-r[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. opiz3-25.12.5-beta1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the rolling build matches the tag
        run: |
          RELEASE=$(echo "$TAG" | sed -n 's/^opiz3-\([0-9.]*\)-.*/\1/p')
          test -n "$RELEASE"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          test -f "docs/releases/$TAG.md" || { echo "missing docs/releases/$TAG.md"; exit 1; }
          BUILT=$(gh release view "opiz3-$RELEASE-latest" --json targetCommitish -q .targetCommitish)
          echo "rolling build from $BUILT, tag at $(git rev-parse HEAD)"
          git diff --stat "$BUILT" HEAD -- package scripts target .github/workflows/build-ib.yml
          git diff --quiet "$BUILT" HEAD -- package scripts target .github/workflows/build-ib.yml || {
            echo "build inputs changed since the rolling build; let build-ib.yml finish first"; exit 1; }

      - name: Create the release
        run: |
          mkdir art
          gh release download "opiz3-$RELEASE-latest" -D art
          ls -la art
          # a pushed tag already exists; by hand the tag is created here
          if [ "$GITHUB_EVENT_NAME" = push ]; then T=--verify-tag; else T="--target $GITHUB_SHA"; fi
          gh release create "$TAG" $T --prerelease \
            --title "Orange Pi Zero 3 / Zero 2 OpenWrt $RELEASE (UWE5622) ${TAG#opiz3-$RELEASE-}" \
            --notes-file "docs/releases/$TAG.md" art/*
